name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test (Android + desktop + server)
        run: ./gradlew build

  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pipeline integration test (PostGIS + G-NAF fixture)
        run: pipeline/tests/test_load_gnaf.sh
      - name: Pipeline integration test (suburbs, lots, address links)
        run: pipeline/tests/test_lots.sh

  server-db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Tile SQL against PostGIS
        run: server/tests/run-db-tests.sh
