name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test (shared, client, server, web)
        run: ./gradlew build
      - name: Build the web bundle
        run: ./gradlew :webApp:jsBrowserDistribution

  browser:
    # Smoke tests in the Chrome that GitHub's runners already have (ADR 0032); the API is faked, so no database is needed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Browser smoke tests
        run: ./gradlew :e2e:e2eTest

  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pipeline integration test (PostGIS + G-NAF fixture)
        run: pipeline/tests/test_load_gnaf.sh
      - name: Pipeline integration test (suburbs, lots, address links)
        run: pipeline/tests/test_lots.sh
      - name: Pipeline integration test (sales and suburb statistics)
        run: pipeline/tests/test_sales.sh
      - name: Pipeline integration test (OpenStreetMap proximity)
        run: pipeline/tests/test_osm.sh

  server-db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Tile SQL against PostGIS
        run: server/tests/run-db-tests.sh
