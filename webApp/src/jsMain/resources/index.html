<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home Finder</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="map" role="application" aria-label="Map of suburbs"></div>
  <div id="search">
    <input id="search-input" type="search" role="combobox" aria-label="Search for an address or suburb" placeholder="Search address or suburb"
           aria-autocomplete="list" aria-expanded="false" aria-controls="search-results" autocomplete="off" autocapitalize="off" spellcheck="false"
           maxlength="100" data-bwignore="true" data-lpignore="true" data-1p-ignore="true">
    <div id="search-results"></div>
  </div>
  <aside id="card" hidden aria-live="polite"></aside>
  <div id="notice" role="status" hidden></div>
  <div id="key-prompt" hidden>
    <form id="key-form">
      <h2>Home Finder</h2>
      <label for="key-input">API key</label>
      <input id="key-input" type="password" name="homefinder-api-key" autocomplete="off" minlength="16" required
             data-bwignore="true" data-lpignore="true" data-1p-ignore="true" aria-describedby="key-help">
      <p id="key-help">The <code>API_KEY</code> value from <code>server/.env</code> (16 or more characters), not a saved password.</p>
      <button type="submit">Continue</button>
    </form>
  </div>
  <script src="homefinder.js"></script>
</body>
</html>
